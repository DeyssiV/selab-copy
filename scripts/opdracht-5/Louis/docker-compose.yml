version: '3.8'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - 4123:80
    volumes:
      - /home/trouble/docker/vaultwarden/data:/data
      - /home/trouble/docker/vaultwarden/keys:/opt/keys
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - ROCKET_TLS={certs="/opt/keys/vaultwarden.crt", key="/opt/keys/vaultwarden.key"}

  minetest:
    image: lscr.io/linuxserver/luanti:latest
    container_name: minetest
    restart: always
    ports:
      - 30000:30000/udp
    environment:
      - PUID=${MINETEST_PUID}
      - PGID=${MINETEST_PGID}
      - TZ=Europe/Brussels
      - CLI_ARGS=--gameid minetest_game --port 30000
    volumes:
      - /home/trouble/docker/minetest/data:/config/.minetest

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - 8000:8000
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
