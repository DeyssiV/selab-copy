services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: je_wachtwoord
      MYSQL_DATABASE: appdb
      MYSQL_USER: appusr
      MYSQL_PASSWORD: letmein!
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
